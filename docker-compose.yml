# ==============================================================================
# YAWSCENT INDONESIA - PRODUCTION DOCKER COMPOSE ORCHESTRATION
# ==============================================================================
services:
  # 1. Web Storefront, Scent Finder & Admin UI
  web:
    container_name: yawscent-web
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - yawscent-net

  # 2. Omnichannel Backend REST API Engine
  backend:
    container_name: yawscent-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://yawscent_user:yawscent_secure_pass_2026@postgres:5432/yawscent_db?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY:-}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY:-}
      - BITESHIP_API_KEY=${BITESHIP_API_KEY:-}
    depends_on:
      - postgres
      - redis
    networks:
      - yawscent-net

  # 3. PostgreSQL Database with Persistent Storage
  postgres:
    image: postgres:16-alpine
    container_name: yawscent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yawscent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yawscent_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-yawscent_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yawscent_user} -d ${POSTGRES_DB:-yawscent_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - yawscent-net

  # 4. Redis Cache & Atomic Stock Reservation Lock
  redis:
    image: redis:7-alpine
    container_name: yawscent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yawscent-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  yawscent-net:
    driver: bridge
