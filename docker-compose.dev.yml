# ==============================================================================
# YAWSCENT INDONESIA - DEVELOPMENT DOCKER COMPOSE (HOT RELOAD)
# ==============================================================================
services:
  web:
    container_name: yawscent-web-dev
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - BACKEND_URL=http://backend:5000
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - yawscent-dev-net

  backend:
    container_name: yawscent-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://yawscent_user:yawscent_secure_pass_2026@postgres:5432/yawscent_db?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY:-}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY:-}
      - BITESHIP_API_KEY=${BITESHIP_API_KEY:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - yawscent-dev-net

  postgres:
    image: postgres:16-alpine
    container_name: yawscent-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yawscent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yawscent_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-yawscent_db}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yawscent_user} -d ${POSTGRES_DB:-yawscent_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - yawscent-dev-net

  redis:
    image: redis:7-alpine
    container_name: yawscent-redis-dev
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - yawscent-dev-net

volumes:
  postgres_dev_data:
    driver: local

networks:
  yawscent-dev-net:
    driver: bridge
